name: Iris ML Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ml-quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train Iris model
        run: python train_model.py

      - name: Check model quality
        run: python quality_gate.py

      - name: Run ML pipeline tests
        run: python -m pytest test_ml_pipeline.py
